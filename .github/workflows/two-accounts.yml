name: two-accounts
# OBS-354: a port per OS account, measured on a host with two real accounts. The suites inject the account
# count; this job is the one place two people's accounts allocate side by side, write their claims in the
# host's shared folder and must end on distinct blocks. One Linux job, run every night, on a dispatch, and on a
# pull request only when the port code or this file changes, so it never adds to the runner queue otherwise
# (OBS-528).
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/two-accounts.yml
      - observatory/engine/local_ports.py
      - observatory/engine/host_accounts.py
      - observatory/engine/peer_check.py
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  two-accounts:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install package
        run: python -m pip install -c requirements-full.lock '.[full]'
      - name: A second person's account
        run: |
          sudo useradd --create-home --shell /bin/bash observatory-b
          python -c "import sys; sys.path.insert(0, 'observatory/engine'); import host_accounts as h; d = h.detail(); print(d); sys.exit(0 if (d['count'] or 2) >= 2 else 1)"
      - name: Each account allocates its own block, and each sees the other's claim
        run: |
          set -euo pipefail
          cli="$(command -v project-observatory)"
          a="$RUNNER_TEMP/ws-a"
          b_home="$(getent passwd observatory-b | cut -d: -f6)"
          b="$b_home/ws-b"
          as_b() { sudo -u observatory-b -H env PATH="$PATH" HOME="$b_home" "$@"; }
          "$cli" --home "$a" full init
          as_b "$cli" --home "$b" full init
          OBSERVATORY_HOME="$a" "$cli" full ports allocate > "$RUNNER_TEMP/a.json"
          as_b env OBSERVATORY_HOME="$b" "$cli" full ports allocate > "$RUNNER_TEMP/b.json"
          cat "$RUNNER_TEMP/a.json" "$RUNNER_TEMP/b.json"
          ls -ln /var/tmp/.passioncode-ports.project-observatory.*.json
          python - "$RUNNER_TEMP/a.json" "$RUNNER_TEMP/b.json" <<'EOF'
          import json, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:3])
          assert a["ok"] and b["ok"], (a, b)
          assert a["scheme"] == b["scheme"] == "allocated", (a["scheme"], b["scheme"])
          assert set(a["ports"].values()).isdisjoint(b["ports"].values()), (a["ports"], b["ports"])
          print("distinct blocks:", a["ports"]["server"], b["ports"]["server"])
          EOF
          # Allocating again keeps each record, and the other's claim is still read (OBS-354 R-3).
          OBSERVATORY_HOME="$a" "$cli" full ports allocate | python -c "import json, sys; d = json.load(sys.stdin); assert d['kept'], d"
          OBSERVATORY_HOME="$a" "$cli" full ports show
