# The release: the wheel, the Mac app signed with the organization's CI Developer ID, notarized
# and stapled, and the Windows (x64, arm64) and Linux (x64, arm64) app; then attested (Sigstore),
# summed and GPG-signed, and published by the organization's shared workflow (PL-10).
# Signing happens only here, in the protected `release` environment. Approval is
# by checks: release-guard requires main ancestry and exact-commit CI success;
# release-approvers control tag pushes. See AGENTS.md Releasing. A published
# release is never rewritten: a fix is a new tag.
#
# Release:    push an annotated vX.Y.Z tag on the reviewed release commit.
# Rehearsal:  push vX.Y.Z-rc.N (the push trigger ignores it), then
#             gh workflow run release.yml --ref vX.Y.Z-rc.N -f publish=false
#             The signed set is kept as a workflow artifact; no release is created.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      publish:
        description: "false = rehearsal: sign, notarize and attest, create no release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Approval by checks (passioncode-ai/.github docs/release-signing/DESIGN.md, operator 2026-10-11):
  # every job that holds the release environment's keys needs this one, which passes a publishing
  # run only when main contains the tagged commit and CI passed on that exact commit.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: write   # starts CI on the tag when none ran on the commit
    steps:
      - uses: passioncode-ai/.github/actions/release-guard@v1
        with:
          workflows: check.yml
          publish: ${{ github.event_name == 'push' || inputs.publish }}

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build and check the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist .
          python tools/check_package.py dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-wheel
          path: dist/*.whl
          if-no-files-found: error

  # The manifest a host admits pins its schemas at raw.githubusercontent.com/<repo>/<tag>/: every tag
  # must be this release or an older one, or a commit sha (0.24.0 pinned v0.24.1 and answered 404 until
  # the next release, ENG-018). The tag this run was started by exists now, so a publishing run also
  # reads every URL once; a rehearsal (vX.Y.Z-rc.N) checks the order only, its vX.Y.Z tag not pushed yet.
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Every pinned URL names this release or an older tag, and resolves
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          release="${GITHUB_REF_NAME%%-*}"
          resolve=(); if [ "$PUBLISH" = true ]; then resolve=(--resolve); fi
          python observatory/engine/tools/check_manifest_urls.py --release "$release" "${resolve[@]}"

  macos:
    needs: [guard]
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # CFBundleVersion counts commits; a shallow clone would number the bundle 1
      - id: sign
        uses: passioncode-ai/.github/actions/apple-signing@v1
        with:
          developer-id-p12-b64: ${{ secrets.APPLE_DEVELOPER_ID_P12_B64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          team-id: ${{ vars.APPLE_TEAM_ID }}
      - name: Build the app, signed with the Developer ID
        env:
          OBSERVATORY_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: macos/scripts/build-app.sh dist/macos
      - uses: passioncode-ai/.github/actions/notarize@v1
        with:
          path: dist/macos/Project Observatory.app
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-key-p8-b64: ${{ secrets.ASC_API_KEY_P8_B64 }}
      - name: Package the stapled app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          mkdir -p dist/release
          ditto -c -k --keepParent "dist/macos/Project Observatory.app" "dist/release/ProjectObservatory-$version-macos.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*.zip
          if-no-files-found: error
      - if: always()
        uses: passioncode-ai/.github/actions/apple-signing/cleanup@v1

  # The Windows app (desktop/, W8), per architecture on its own runner: the executable signed, the NSIS
  # installer built around it and signed, installed silently, then named and receipted (PL-02, PL-03,
  # PL-10). Authenticode through the organization's Azure Artifact Signing over OIDC only while the
  # release environment's AZURE_SIGNING_ENABLED is true; otherwise the receipt and the notes say NOT_SIGNED.
  windows:
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write   # windows-signing (OIDC), only when signing is switched on
    env:
      SIGNING: ${{ vars.AZURE_SIGNING_ENABLED == 'true' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: An unsigned Windows release says so in its notes
        run: python tools/desktop_release.py preflight --tag "${GITHUB_REF_NAME}" --signing "$SIGNING"
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the executable
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --no-bundle --ci
      # Pass 1: the program, before the installer packs it.
      - if: env.SIGNING == 'true'
        uses: passioncode-ai/.github/actions/windows-signing@v1
        with:
          files: |
            ${{ github.workspace }}\desktop\src-tauri\target\release\project-observatory-app.exe
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          expected-subject: O=Siarhei Sheleh
          report: ${{ runner.temp }}\signatures-exe.json
      - name: Bundle the NSIS installer
        working-directory: desktop
        run: npx tauri bundle --bundles nsis --ci
      # Pass 2: the installer itself; its report goes into the receipt.
      - if: env.SIGNING == 'true'
        uses: passioncode-ai/.github/actions/windows-signing@v1
        with:
          files-folder: ${{ github.workspace }}\desktop\src-tauri\target\release\bundle\nsis
          files-folder-filter: exe
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          expected-subject: O=Siarhei Sheleh
          report: ${{ runner.temp }}\signatures.json
      - name: The installer installs the app and removes it again
        shell: pwsh
        run: |
          $setup = (Get-ChildItem desktop\src-tauri\target\release\bundle\nsis -Filter *-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'observatory-install-check'
          $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir 'project-observatory-app.exe'))) { throw 'the program is not installed' }
          $u = Join-Path $dir 'uninstall.exe'
          if (Test-Path $u) { Start-Process -FilePath $u -ArgumentList '/S' -Wait }
      - name: Name the installer and write its receipt
        run: |
          sig=(); if [ "$SIGNING" = true ]; then sig=(--signatures "$RUNNER_TEMP/signatures.json"); fi
          python tools/desktop_release.py package --platform windows --arch ${{ matrix.arch }} --signing "$SIGNING" \
            --bundle desktop/src-tauri/target/release/bundle --out dist/release --check install=PASS "${sig[@]}"
      # After the last Authenticode pass, so the bytes the updater verifies are the ones shipped (PL-04).
      - name: Sign the installer for the app's updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          setup="$PWD/dist/release/ProjectObservatory-$version-windows-${{ matrix.arch }}-setup.exe"
          (cd desktop && npx tauri signer sign --app-version "$version" "$setup")
          test -s "$setup.sig"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  # The Linux app: an AppImage and a .deb per architecture, built natively; the .deb installed and its
  # program found. Linux packages are covered by SHA256SUMS, its signature and the attestations (PL-03).
  linux:
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    environment: release   # the updater's signing key
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the AppImage and the .deb
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles appimage,deb --ci
      - name: The .deb installs the app
        run: |
          sudo apt-get install -y "./$(ls desktop/src-tauri/target/release/bundle/deb/*.deb)"
          test -x /usr/bin/project-observatory-app
      - name: Name the packages and write their receipt
        run: |
          python tools/desktop_release.py package --platform linux --arch ${{ matrix.arch }} \
            --bundle desktop/src-tauri/target/release/bundle --out dist/release --check deb-install=PASS
      - name: Sign the AppImage for the app's updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          image="$PWD/dist/release/ProjectObservatory-$version-linux-${{ matrix.arch }}.AppImage"
          (cd desktop && npx tauri signer sign --app-version "$version" "$image")
          test -s "$image.sig"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  # The update feed the installed app reads (PL-04): one entry per platform shipped, each naming its
  # file under this tag with that file's own signature; a feed missing a platform stops the release.
  feed:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-windows-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-linux-*
          path: dist/release
          merge-multiple: true
      - name: Write and check latest.json
        run: |
          python tools/desktop_release.py feed --tag "${GITHUB_REF_NAME}" --dir dist/release
          mkdir -p dist/feed && cp dist/release/latest.json dist/feed/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-feed
          path: dist/feed/latest.json
          if-no-files-found: error

  publish:
    needs: [wheel, manifest, macos, windows, linux, feed]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: passioncode-ai/.github/.github/workflows/release-publish.yml@v1
    with:
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    secrets: inherit
