# The Windows and Linux app (desktop/, W8): its Rust tests and an unsigned build of each package, on
# the systems that ship it — an NSIS installer on windows-latest, an AppImage and a .deb on Ubuntu. The
# installer is then installed silently and its program found. Signed builds are release.yml's (W9).
# Runs on pull requests that touch desktop/ and by hand; never on every push (docs/CI-BATCHING.md).
name: desktop

on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: ubuntu-24.04
            bundle: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm ci
      - name: Build the package (unsigned)
        run: npx tauri build --bundles ${{ matrix.bundle }} --ci
      - name: The installer installs the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem src-tauri\target\release\bundle\nsis -Filter *-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'observatory-install-check'
          $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir 'project-observatory-app.exe'))) { throw 'the program is not installed' }
          $u = Join-Path $dir 'uninstall.exe'
          if (Test-Path $u) { Start-Process -FilePath $u -ArgumentList '/S' -Wait }
      - name: The .deb installs (Linux)
        if: runner.os == 'Linux'
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          sudo apt-get install -y "./$deb"
          test -x "/usr/bin/project-observatory-app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
