name: observatory-release-check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os != 'macOS'
        with:
          python-version: ${{ matrix.python }}
      - name: Install macOS Python with SQLite extension support
        if: runner.os == 'macOS'
        run: |
          brew install python@3.14
          "$(brew --prefix python@3.14)/bin/python3.14" -m venv "$RUNNER_TEMP/observatory-python"
          echo "$RUNNER_TEMP/observatory-python/bin" >> "$GITHUB_PATH"
      - name: Require SQLite extension support
        run: python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.enable_load_extension(True); c.enable_load_extension(False)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: The lock carries every pin (a Dependabot bump of pyproject.toml alone stops here)
        run: python tools/refresh_lock.py --check
      - name: Install package
        run: python -m pip install -c requirements-full.lock '.[full]'
      - name: Compile every distributed Python module on the matrix interpreter
        run: python -m compileall -q observatory
      - name: Synthetic runtime and privacy tests
        run: python -m unittest discover -s tests -v
      - name: Native macOS bridge and state tests
        if: runner.os == 'macOS'
        run: swift test --package-path macos
      - name: Build and validate native macOS candidate bundle
        if: runner.os == 'macOS'
        run: macos/scripts/build-app.sh
      - name: Complete engine offline compatibility and security matrix
        run: project-observatory full check --report-dir "${{ runner.temp }}/observatory-full-check"
      - name: Build and inspect the installable archive
        shell: bash
        run: |
          python tools/update_inventory.py --check
          python -m pip wheel --no-deps . --wheel-dir dist
          python tools/check_package.py dist/*.whl
      - name: Claude Code validates the plugin and both marketplaces strictly
        # Claude Code's own parser: manifests, hooks and every SKILL.md front matter.
        # One matrix row is enough (the check reads files, not the interpreter),
        # and it stays inside the required `test` job so a failure blocks a merge.
        # The version is pinned so a CLI release cannot change the verdict unseen;
        # the engine's own strict front-matter check (tests/test_skill.py) also
        # refuses what this CLI accepts, such as an unquoted ': ' in a description.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        shell: bash
        env:
          CLAUDE_CODE_VERSION: '2.1.284'
          DISABLE_AUTOUPDATER: '1'
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          claude --version
          for dir in . observatory/engine/skill observatory/engine/skill/plugins/observatory-log; do
            claude plugin validate --strict "$dir"
          done
      - name: Public tree and complete Git blob history
        # HEAD only: another open pull request must not fail this one; each PR scans its own history.
        run: python tools/check_public_release.py --history --history-ref HEAD
      - name: Public static site allowlist and negative probes
        run: |
          python docs/site/check.py --self-test
          python tools/build_article.py --check
          node tools/check_site_interactions.cjs
      - name: Installed CLI sterile demo
        shell: bash
        run: |
          demo_root="$(mktemp -d)"
          demo_root="$(cd "$demo_root" && pwd -P)"
          project-observatory --home "$demo_root/state" demo
          project-observatory --home "$demo_root/state" doctor
          project-observatory --home "$demo_root/state" export
      - name: Installed full engine sterile workspace
        shell: bash
        run: |
          runtime_root="$(mktemp -d)"
          runtime_root="$(cd "$runtime_root" && pwd -P)"
          python -m venv "$runtime_root/venv"
          wheel_path="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          "$runtime_root/venv/bin/python" -m pip install -c requirements-full.lock "${wheel_path}[full]"
          export OBSERVATORY_HOME="$runtime_root/state"
          mkdir -p "$runtime_root/projects/example-app"
          printf '%s\n' '{"name":"example-app"}' > "$runtime_root/projects/example-app/package.json"
          cd "$runtime_root"
          "$runtime_root/venv/bin/project-observatory" full init
          "$runtime_root/venv/bin/project-observatory" full configure sources projects "$runtime_root/projects"
          "$runtime_root/venv/bin/project-observatory" full local
          "$runtime_root/venv/bin/project-observatory" full doctor
          "$runtime_root/venv/bin/project-observatory" full upgrade
      - name: Installed full engine without the lock file
        shell: bash
        run: |
          # The package is not published on PyPI; an install from the built wheel's
          # `[full]` extra without `-c requirements-full.lock` resolves newer
          # transitive releases, and they must not break the MCP wire or the pages.
          runtime_root="$(mktemp -d)"
          runtime_root="$(cd "$runtime_root" && pwd -P)"
          python -m venv "$runtime_root/venv"
          wheel_path="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          "$runtime_root/venv/bin/python" -m pip install "${wheel_path}[full]"
          "$runtime_root/venv/bin/python" -m pip freeze > "$runtime_root/freeze.txt"
          export OBSERVATORY_HOME="$runtime_root/state"
          cd "$runtime_root"
          "$runtime_root/venv/bin/project-observatory" full init
          "$runtime_root/venv/bin/project-observatory" full check --suite mcp_wire --suite wire_contract --suite pages
      - name: No tracked changes
        run: git diff --exit-code

      - name: Preserve synthetic compatibility logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-check-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/observatory-full-check
          if-no-files-found: ignore
          retention-days: 7

  windows:
    # docs/design/WINDOWS-LINUX.md, W0: what the engine does on Windows, measured on every
    # change. Informative until W3 — each step runs whatever the one before it did, and the
    # summary lists every outcome — so it is not one of the required checks yet.
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - id: sqlite
        name: SQLite extension support
        continue-on-error: true
        run: python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.enable_load_extension(True); c.enable_load_extension(False)"
      - id: install
        name: Install package
        run: python -m pip install -c requirements-full.lock '.[full]'
      - id: compile
        name: Compile every distributed Python module
        continue-on-error: true
        run: python -m compileall -q observatory
      - id: imports
        name: Every engine library module loads
        continue-on-error: true
        run: python tools/check_imports.py
      - id: oslocks
        name: One lock API on every OS (W1)
        continue-on-error: true
        run: python observatory/engine/tests/test_oslocks.py
      - id: osproc
        name: Process groups on every OS (W2)
        continue-on-error: true
        run: python observatory/engine/tests/test_osproc.py
      - id: osprivacy
        name: Who the engine runs as (W2b)
        continue-on-error: true
        run: python observatory/engine/tests/test_osprivacy.py
      - id: osschedule
        name: Background jobs under Task Scheduler (W4)
        continue-on-error: true
        run: python observatory/engine/tests/test_osschedule.py
      - id: cli
        name: The CLI answers
        continue-on-error: true
        run: |
          project-observatory --help
          demo_root="$(mktemp -d)"
          project-observatory --home "$demo_root/state" demo
          project-observatory --home "$demo_root/state" doctor
      - id: tick
        name: A whole tick runs in a sandbox workspace (W3)
        continue-on-error: true
        run: |
          ws="$RUNNER_TEMP/tick-ws"
          mkdir -p "$RUNNER_TEMP/tick-projects/example"
          printf '%s\n' '{"name":"example"}' > "$RUNNER_TEMP/tick-projects/example/package.json"
          project-observatory --home "$ws" full init
          project-observatory --home "$ws" full configure sources projects "$RUNNER_TEMP/tick-projects"
          project-observatory --home "$ws" full configure features scheduler true
          OBSERVATORY_HOME="$ws" OBSERVATORY_SYSTEM_SETUP=0 python observatory/engine/tools/tick.py | tee "$RUNNER_TEMP/tick.log"
          grep -q " tick done$" "$RUNNER_TEMP/tick.log"
          python -c "import json, sys; d = json.load(open(sys.argv[1], encoding='utf-8')); print(d); sys.exit(1 if d['failed_steps'] else 0)" "$ws/store/raw/tick.json"
      - id: jobs
        name: The server and the tick under Task Scheduler (W4b)
        continue-on-error: true
        run: |
          ws="$RUNNER_TEMP/jobs-ws"
          project-observatory --home "$ws" full init
          project-observatory --home "$ws" full configure features scheduler true
          export OBSERVATORY_HOME="$ws"
          python observatory/engine/tools/serverd.py --install
          python -c "import json, sys, urllib.request; d = json.load(urllib.request.urlopen('http://127.0.0.1:47311/.well-known/fabric-service', timeout=10)); print(d['service']['id'], d['service']['instance'], d['status'])"
          python observatory/engine/tools/serverd.py --uninstall
          python observatory/engine/tools/install_launchd.py install
          python observatory/engine/tools/install_launchd.py status
          python observatory/engine/tools/install_launchd.py uninstall
          schtasks /Query /FO LIST | grep -c ProjectObservatory || true
      - id: tests
        name: Synthetic runtime and privacy tests
        continue-on-error: true
        run: python -m unittest discover -s tests
      - name: Outcomes
        if: always()
        run: |
          {
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| SQLite extension support | ${{ steps.sqlite.outcome }} |"
            echo "| Compile | ${{ steps.compile.outcome }} |"
            echo "| Engine modules load | ${{ steps.imports.outcome }} |"
            echo "| oslocks | ${{ steps.oslocks.outcome }} |"
            echo "| osproc | ${{ steps.osproc.outcome }} |"
            echo "| osprivacy | ${{ steps.osprivacy.outcome }} |"
            echo "| osschedule | ${{ steps.osschedule.outcome }} |"
            echo "| server and tick jobs | ${{ steps.jobs.outcome }} |"
            echo "| CLI | ${{ steps.cli.outcome }} |"
            echo "| A whole tick | ${{ steps.tick.outcome }} |"
            echo "| Top-level tests | ${{ steps.tests.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
