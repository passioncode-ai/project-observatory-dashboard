[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "project-observatory"
version = "0.21.0"
description = "A local observation layer for agent-operated projects"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only OR LicenseRef-PassionCode-Commercial"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]
authors = [{name = "PassionCode.ai", email = "contact@passioncode.ai"}]
dependencies = []
keywords = ["observability", "developer-tools", "agents", "claude-code", "mcp", "dashboard", "secrets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://passioncode.ai/observatory/"
Source = "https://github.com/passioncode-ai/project-observatory-dashboard"
Changelog = "https://github.com/passioncode-ai/project-observatory-dashboard/blob/main/CHANGELOG.md"
Issues = "https://github.com/passioncode-ai/project-observatory-dashboard/issues"
Security = "https://github.com/passioncode-ai/project-observatory-dashboard/security/policy"

[project.scripts]
project-observatory = "observatory.cli:main"
observatory = "observatory.cli:main"

[tool.setuptools]
packages = ["observatory"]

[project.optional-dependencies]
full = ["mcp==2.3.0", "jsonschema==4.26.0", "sqlite-vec==0.1.9", "google-auth==2.59.1", "cryptography==50.0.2", "snowballstemmer==3.1.1"]

[tool.setuptools.package-data]
observatory = ["engine/**/*", "engine/skill/.claude-plugin/*.json", "engine/skill/plugins/*/.claude-plugin/*.json"]

[tool.setuptools.exclude-package-data]
observatory = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
