[package]
name = "project-observatory-desktop"
version = "0.21.0"
description = "Project Observatory for Windows and Linux"
authors = ["PassionCode.ai"]
license = "AGPL-3.0-only OR LicenseRef-PassionCode-Commercial"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "project-observatory-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
sys-locale = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
