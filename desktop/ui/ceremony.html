<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair this machine</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="ceremony.css"></head>
<body><main class="ceremony" aria-live="polite">
  <h1 id="title" data-t="Pair this machine">Pair this machine</h1>
  <p id="body"></p>
  <p class="code" id="code" hidden></p>
  <p class="hint" id="fingerprint" hidden></p>
  <ul class="keys" id="keys" hidden></ul>
  <p class="hint" id="note" hidden></p>
  <p class="hint" id="reason" hidden></p>
  <div class="actions" id="actions"></div>
  <p class="status" id="status" role="status"></p>
</main>
<script src="app.js"></script>
<script src="ceremony.js"></script></body></html>
